name: Index option research verification

on:
  push:
    branches:
      - index-option-research-v1-20260920
      - index-option-stage3-audit-20260922
      - index-option-stage3b-killtest-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile research code
        run: >
          python -m compileall -q
          app/index_option_research.py
          app/index_option_history.py
          app/index_option_stage2.py
          app/index_option_stage2_history.py
          app/index_option_stage3.py
          app/index_option_fees.py
          app/index_option_historical_sources.py
          app/index_option_stage3b.py
          scripts/run_index_option_stage1.py
          scripts/run_index_option_stage2.py
          scripts/run_index_option_stage3.py
          scripts/fetch_index_option_historical_proxy.py
          scripts/run_index_option_stage3b.py
          scripts/run_index_option_stage3b_alignment.py
          tests/test_index_option_research.py
          tests/test_index_option_history.py
          tests/test_index_option_stage2.py
          tests/test_index_option_stage2_history.py
          tests/test_index_option_stage3.py
          tests/test_index_option_historical_sources.py
          tests/test_index_option_stage3b.py
      - name: Run research tests
        run: >
          pytest -q
          tests/test_index_option_research.py
          tests/test_index_option_history.py
          tests/test_index_option_stage2.py
          tests/test_index_option_stage2_history.py
          tests/test_index_option_stage3.py
          tests/test_index_option_historical_sources.py
          tests/test_index_option_stage3b.py
