name: Phase A Security Checks

on:
  push:
    branches:
      - "security/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Compile application
        run: python -m compileall -q app run.py

      - name: Run Phase A security regression tests
        run: pytest -q tests/test_security_phase_a.py

      - name: Audit pinned Python dependencies
        run: pip-audit -r requirements.txt
