name: Phase A Security Checks

on:
  push:
    branches:
      - "security/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Compile application
        run: python -m compileall -q app run.py

      - name: Run Phase A security regression tests
        run: PYTHONPATH=. pytest -q tests/test_security_phase_a.py

      - name: Run DBIndicator regression suite excluding documented base debt
        run: >-
          PYTHONPATH=. pytest -q
          --deselect=test_stock_in_play_breakout.py::test_intraday_best_entry_uses_breakout_participation_location_and_sponsorship
          --deselect=test_stock_in_play_breakout.py::test_missing_oi_is_explicit_and_requires_stronger_non_oi_sponsorship
          --deselect=test_stock_in_play_breakout.py::test_swing_candidate_is_separate_and_requires_late_session_persistence_and_htf
          --deselect=test_stock_in_play_breakout.py::test_dashboard_and_backtest_copy_use_new_stages_and_real_horizons
          --deselect=test_stock_in_play_breakout.py::test_swing_can_qualify_on_retention_bar_without_a_second_fresh_breakout
          --deselect=test_stock_in_play_breakout.py::test_numpy_boolean_flags_count_as_confirmed_in_live_classifier
          --deselect=tests/test_v120_trade_console.py::test_futures_liquidity_promotes_setup_to_executable_candidate
          --deselect=tests/test_v120_trade_console.py::test_extended_high_score_is_downgraded_to_watch
          --deselect=tests/test_v927_market_regime_forward.py::test_opportunity_radar_uses_multifactor_regime_as_bonus_not_veto

      - name: Surface documented base regression debt
        continue-on-error: true
        run: >-
          PYTHONPATH=. pytest -q
          test_stock_in_play_breakout.py::test_intraday_best_entry_uses_breakout_participation_location_and_sponsorship
          test_stock_in_play_breakout.py::test_missing_oi_is_explicit_and_requires_stronger_non_oi_sponsorship
          test_stock_in_play_breakout.py::test_swing_candidate_is_separate_and_requires_late_session_persistence_and_htf
          test_stock_in_play_breakout.py::test_dashboard_and_backtest_copy_use_new_stages_and_real_horizons
          test_stock_in_play_breakout.py::test_swing_can_qualify_on_retention_bar_without_a_second_fresh_breakout
          test_stock_in_play_breakout.py::test_numpy_boolean_flags_count_as_confirmed_in_live_classifier
          tests/test_v120_trade_console.py::test_futures_liquidity_promotes_setup_to_executable_candidate
          tests/test_v120_trade_console.py::test_extended_high_score_is_downgraded_to_watch
          tests/test_v927_market_regime_forward.py::test_opportunity_radar_uses_multifactor_regime_as_bonus_not_veto

      - name: Audit pinned Python dependencies
        # KiteConnect currently pins autobahn[twisted]==19.11.2 exactly. The two
        # Autobahn advisories are tracked as a temporary upstream exception;
        # every other dependency vulnerability remains a hard CI failure.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2020-25
          --ignore-vuln CVE-2026-77528
