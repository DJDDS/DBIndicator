name: V12.2B CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app
      - name: V12.2B focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_v122b_tactical.py tests/test_v122a_interim_tactical_radar.py tests/test_v121_index_recorder.py
      - name: Full regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

# regression-compatible UI cleanup
