name: v123-execution-window-ci
on:
  push:
    branches:
      - v123-execution-window
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_v122b_tactical.py tests/test_v123_focus.py
