name: Build historical FO PIT snapshots
on:
  push:
    branches:
      - research/nifty500-pit-fno-split
  workflow_dispatch:
jobs:
  fo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests xlrd openpyxl
      - run: python research/build_fo_pit_wayback.py
      - run: |
          cat /tmp/fo_pit/meta.json
          cat /tmp/fo_pit/manifest.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fo-pit-snapshots
          path: /tmp/fo_pit/
          retention-days: 14
