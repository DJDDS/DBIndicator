name: NIFTY500 1m analysis only
on:
  push:
    branches:
      - research/nifty500-1m-analysis-only
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow scikit-learn
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37012471441
          pattern: clean-1m-panel-*
          path: /tmp/panels
      - name: Analyze frozen minute panel
        run: python research/nifty500_1m_clean_slate_analyze.py
      - name: Show results
        run: |
          cat /tmp/final/population_sizes.csv
          cat /tmp/final/fno_cluster_characteristics.csv
          cat /tmp/final/nonfno_cluster_characteristics.csv
          cat /tmp/final/fno_metrics.csv
          cat /tmp/final/nonfno_metrics.csv
          head -25 /tmp/final/fno_feature_importance.csv
          head -25 /tmp/final/nonfno_feature_importance.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nifty500-1m-clean-slate-final
          path: /tmp/final/
          retention-days: 14
