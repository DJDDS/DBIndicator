name: Recorder backup verification

on:
  push:
    branches: [recorder-backup-fix-clean-20260916]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Regression test
        run: pytest -q tests/test_v121_backup_race.py
      - name: Full suite
        run: pytest -q
