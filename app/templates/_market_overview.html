<section class="mo" id="market-overview" aria-label="Market and scanner pulse">
<style>
  .mo{margin-bottom:14px}
  .mo-idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
  .mo-card{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:10px;padding:10px 12px 8px;color:var(--text);text-decoration:none;display:block;transition:border-color .15s,transform .15s;overflow:hidden}
  a.mo-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .mo-card .l{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .mo-card .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:3px}
  .mo-card .v b{font-size:18px;font-family:var(--mono);font-weight:650}
  .mo-pill{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;font-family:var(--mono);white-space:nowrap}
  .mo-pill.up{color:var(--green);background:var(--green-bg)}.mo-pill.dn{color:var(--red);background:var(--red-bg)}.mo-pill.na{color:var(--muted);background:var(--panel2)}
  .mo-spark{display:block;width:100%;height:34px;margin-top:4px}
  .mo-pts{font-size:12px;font-weight:650;font-family:var(--mono);margin:1px 0 2px}.mo-pts.up{color:var(--green)}.mo-pts.dn{color:var(--red)}.mo-pts.na{color:var(--muted)}.mo-pts i{font-style:normal;font-size:9.5px;font-weight:600;color:var(--muted);margin-left:4px;text-transform:uppercase}
  .mo-rng{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--dim);font-family:var(--mono);margin:3px 0 1px}
  .mo-rng .bar{position:relative;flex:1;height:4px;border-radius:2px;background:var(--border)}
  .mo-rng .bar i{position:absolute;top:-3px;width:3px;height:10px;border-radius:2px;background:var(--text);transform:translateX(-1px)}
  .mo-rng .bar u{position:absolute;top:-1px;width:1px;height:6px;background:var(--muted)}
  @keyframes moUp{from{background:rgba(22,199,132,.28)}to{background:transparent}}@keyframes moDn{from{background:rgba(234,57,67,.28)}to{background:transparent}}
  .mo-card .v b.fu{animation:moUp 1.4s ease-out}.mo-card .v b.fd{animation:moDn 1.4s ease-out}
  .mo-sec{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11.5px;margin:0 0 10px;padding:6px 10px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .mo-sec b{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.mo-sec a{color:var(--text);text-decoration:none;font-family:var(--mono)}.mo-sec a:hover{color:var(--accent)}
  .mo-tg{margin-left:8px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;font-size:10.5px;padding:1px 7px;cursor:pointer}.mo-tg:hover{color:var(--accent)}
  .mo-sec .up{color:var(--green)}.mo-sec .dn{color:var(--red)}.mo-sec .upd{margin-left:auto;color:var(--dim);font-size:10.5px}
  .mo-wk{display:flex;gap:9px;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  .mo-wk .up{color:var(--green)}.mo-wk .dn{color:var(--red)}
  .mo-desks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .mo-chip{display:flex;flex-direction:column;gap:1px;min-width:150px;padding:6px 10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;text-decoration:none;color:var(--text);font-size:12px}
  .mo-chip span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.mo-chip b{font-family:var(--mono);font-size:12.5px}.mo-chip small{color:var(--dim);font-size:10.5px}
  .mo-chip.ok{border-left:3px solid var(--green)}.mo-chip.bad{border-left:3px solid var(--red)}.mo-chip.dn b{color:var(--red)}.mo-chip.up b{color:var(--green)}
  .mo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .mo-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px 6px;min-width:0}
  .mo-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .mo-head h2{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .mo-head small{color:var(--dim);font-size:10.5px;margin-left:auto}
  .mo-chart{height:190px;width:100%}
  .mo-tabs{display:flex;gap:2px;margin-left:auto;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:2px}
  .mo-tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;padding:2px 7px;border-radius:5px;cursor:pointer}
  .mo-tabs button[aria-pressed=true]{background:var(--accent-bg);color:var(--text)}
  .mo-foot{font-size:10.5px;color:var(--dim);margin-top:6px}
  .mo-empty{color:var(--muted);text-align:center;padding:60px 10px;font-size:12px}
  @media (max-width:1100px){.mo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){.mo-grid{grid-template-columns:1fr}.mo-idx{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
  <div class="mo-idx" id="mo-idx"></div>
  <div class="mo-sec" id="mo-sec" hidden></div>
  <div class="mo-desks" id="mo-desks" hidden></div>
  <div class="mo-grid">
    <div class="mo-panel"><div class="mo-head"><h2>Scanner direction</h2><small>click a slice to filter</small></div><div class="mo-chart" id="mo-c-dir"><div class="mo-empty">Waiting for the first scan…</div></div></div>
    <div class="mo-panel"><div class="mo-head"><h2>OI structure</h2><small>click to filter the table</small></div><div class="mo-chart" id="mo-c-oi"><div class="mo-empty">Waiting for OI data…</div></div></div>
    <div class="mo-panel"><div class="mo-head"><h2>OI expansion leaders</h2><small>click to find</small></div><div class="mo-chart" id="mo-c-lead"><div class="mo-empty">Waiting for OI data…</div></div></div>
    <div class="mo-panel"><div class="mo-head"><h2>Index trend</h2>
      <div class="mo-tabs" role="group" aria-label="Window" id="mo-win"><button type="button" data-w="22" aria-pressed="false">1M</button><button type="button" data-w="66" aria-pressed="true">3M</button></div></div>
      <div class="mo-chart" id="mo-c-trend"><div class="mo-empty">Loading…</div></div></div>
  </div>
  <div class="mo-foot" id="mo-foot"></div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const ok = n => typeof n === 'number' && isFinite(n);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const fmt = (n, d = 2) => ok(n) ? n.toLocaleString('en-IN', {minimumFractionDigits: d, maximumFractionDigits: d}) : '—';
  const pct = n => ok(n) ? (n > 0 ? '+' : '') + fmt(n) + '%' : '—';
  const cls = n => ok(n) ? (n > 0 ? 'up' : n < 0 ? 'dn' : 'na') : 'na';
  const C = () => { const s = getComputedStyle(document.documentElement), g = k => s.getPropertyValue(k).trim(); return {g: g('--green') || '#16c784', r: g('--red') || '#ea3943', a: g('--accent') || '#3b82f6', t: g('--text') || '#dfe4ee', m: g('--muted') || '#7c8698', b: g('--border') || '#242b38', amber: '#f0b429', p2: g('--panel2') || '#151b26'}; };
  const st = {idx: null, state: null, win: 66, span: (function(){try{return localStorage.getItem('mo-span')||'3M'}catch(e){return '3M'}})(), charts: {}, sig: {}};

  // ---- index strip: no chart library needed (inline SVG sparkline) ----
  function spark(h, up) {
    const v = (h || []).map(x => x[1]).filter(ok); if (v.length < 2) return '<svg class="mo-spark"></svg>';
    const lo = Math.min(...v), hi = Math.max(...v), W = 200, H = 34, dx = W / (v.length - 1), y = x => H - 3 - (hi > lo ? (x - lo) / (hi - lo) : .5) * (H - 6);
    const pts = v.map((x, i) => (i * dx).toFixed(1) + ',' + y(x).toFixed(1)), col = up ? 'var(--green)' : 'var(--red)';
    return `<svg class="mo-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon points="0,${H} ${pts.join(' ')} ${W},${H}" fill="${col}" opacity=".10"/><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  }
  st.prev = {};
  function rng(x) {
    const d = x.d || {}; if (!ok(d.h) || !ok(d.l) || !(d.h > d.l) || !ok(x.price)) return '';
    const pos = v => Math.max(0, Math.min(100, (v - d.l) / (d.h - d.l) * 100)).toFixed(1);
    return `<div class="mo-rng" title="Today: low ${fmt(d.l)} · high ${fmt(d.h)}${ok(d.o) ? ' · open ' + fmt(d.o) : ''}"><span>${fmt(d.l, 0)}</span><div class="bar">${ok(d.o) ? `<u style="left:${pos(d.o)}%"></u>` : ''}<i style="left:${pos(x.price)}%"></i></div><span>${fmt(d.h, 0)}</span></div>`;
  }
  function renderIdx() {
    const L = (st.idx && st.idx.indices) || [];
    if (!L.length) { $('mo-idx').innerHTML = ''; return; }
    $('mo-idx').innerHTML = L.map(x => {
      const r = x.r || {}, up = ((r['3M'] ?? r.today ?? 0) >= 0) !== (x.label === 'INDIA VIX');   // a rising VIX is the red case
      const fl = ok(x.price) && ok(st.prev[x.label]) && x.price !== st.prev[x.label] ? (x.price > st.prev[x.label] ? ' fu' : ' fd') : ''; st.prev[x.label] = x.price;
      const inner = `<span class="l">${esc(x.label)}</span><div class="v"><b class="${fl.trim()}">${fmt(x.price)}</b><span class="mo-pill ${cls(r.today)}">${pct(r.today)}</span></div>
        <div class="mo-pts ${cls(x.chg)}">${ok(x.chg) ? (x.chg > 0 ? '▲ +' : x.chg < 0 ? '▼ ' : '') + fmt(x.chg) + ' pts' : '—'}${x.label === 'GIFT NIFTY' ? ` <i>${x.live ? 'live' : 'last'}${x.asof ? ' · ' + esc(x.asof) + ' IST' : ''}</i>` : (x.live ? ' <i>live</i>' : '')}${ok(x.prem) ? ' <i>' + (x.prem > 0 ? '+' : '') + fmt(x.prem, 0) + ' prem</i>' : ''}</div>${rng(x)}${st.span === '1D' && (x.day || []).length > 2 ? spark(x.day, ok(x.chg) ? x.chg >= 0 !== (x.label === 'INDIA VIX') : up) : spark((x.hist || []).slice(-45), up)}
        ${['1W', '1M', '3M'].some(k => ok(r[k])) ? `<div class="mo-wk">${[['1W', '1W'], ['1M', '1M'], ['3M', '3M']].map(([k, l]) => `<span>${l} <span class="${cls(r[k])}">${pct(r[k])}</span></span>`).join('')}</div>` : ''}`;
      return x.id ? `<a class="mo-card" href="/sector-analysis#${encodeURIComponent(x.id)}" title="Open ${esc(x.label)} on the Sector Analysis page">${inner}</a>` : `<div class="mo-card">${inner}</div>`;
    }).join('');
  }

  // ---- live clock: ticks every second in the browser, no refetch ----
  function istParts() {
    const f = new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Kolkata', hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit'}).formatToParts(new Date()), g = {};
    f.forEach(p => g[p.type] = p.value); return {wd: g.weekday, h: +g.hour % 24, m: +g.minute, s: +g.second};
  }
  function tickClock() {
    const el = $('mo-upd'); if (!el) return;
    const t = istParts(), mins = t.h * 60 + t.m, wk = !['Sat', 'Sun'].includes(t.wd), open = wk && mins >= 555 && mins < 930, pre = wk && mins >= 540 && mins < 555;
    const fmt2 = n => String(n).padStart(2, '0'), left = open ? 930 - mins : (pre ? 555 - mins : 0), lt = left ? (left >= 60 ? Math.floor(left / 60) + 'h ' + fmt2(left % 60) + 'm' : left + 'm') : '';
    const state = open ? `<b class="up">● Market open</b> · closes in ${lt}` : pre ? `<b>◐ Pre-open</b> · opens in ${lt}` : '<b>○ Market closed</b>';
    const q = el.dataset.q, qt = q ? Date.parse(q) : NaN, age = isFinite(qt) ? Math.max(0, Math.round((Date.now() - qt) / 1000)) : null;
    const ageTxt = age == null ? '' : ` · quotes ${age < 90 ? age + 's' : Math.round(age / 60) + 'm'} ago`, stale = open && age != null && age > 120;
    el.innerHTML = `${state}${stale ? ` <span class="dn">${ageTxt.trim()} (stale)</span>` : ageTxt} · ${fmt2(t.h)}:${fmt2(t.m)}:${fmt2(t.s)} IST`;
  }
  setInterval(() => { if (!document.hidden) tickClock(); }, 1000);

  function renderSec() {
    const m = (st.idx && st.idx.sector_movers) || {lead: [], lag: []}, el = $('mo-sec'); if (!st.idx) { el.hidden = true; return; }
    const tg = `<button type="button" class="mo-tg" data-span="${st.span === '1D' ? '3M' : '1D'}" title="Switch the index lines between today (5-min) and the last 3 months">Lines: ${st.span === '1D' ? 'Today' : '3M'} ⇄</button>`;
    const bd = st.idx.breadth, adv = bd ? Math.round(100 * bd.up / Math.max(1, bd.up + bd.dn)) : null;
    const read = !bd ? '' : (adv >= 65 ? 'broad strength' : adv <= 35 ? 'broad weakness' : bd.gap != null && bd.gap > 0.4 ? 'index ahead of the average stock (narrow)' : bd.gap != null && bd.gap < -0.4 ? 'average stock ahead of the index' : 'mixed');
    const br = bd ? `<b>Breadth</b><span><span class="up">${bd.up}▲</span> / <span class="dn">${bd.dn}▼</span> (${adv}% up) · avg <span class="${cls(bd.avg)}">${pct(bd.avg)}</span> · ≥+1% ${bd.up1} · ≤−1% ${bd.dn1} · <i style="font-style:normal;color:var(--muted)">${read}</i></span>` : '';
    el.innerHTML = `${br}<b>Leading</b>${m.lead.map(chip).join('')}<b>Lagging</b>${m.lag.map(chip).join('')}<span class="upd" id="mo-upd" data-q="${esc(q || '')}"></span>${tg}`; el.hidden = false; tickClock();
    const b = el.querySelector('.mo-tg'); if (b) b.onclick = () => { st.span = b.dataset.span; try { localStorage.setItem('mo-span', st.span); } catch (e) {} renderIdx(); renderSec(); };
  }

  // ---- charts (ECharts loads after first paint; updates use setOption so nothing re-flows) ----
  let echartsReady = null;
  function loadEcharts() {
    if (window.echarts) return Promise.resolve();
    if (!echartsReady) echartsReady = new Promise((res, rej) => { const s = document.createElement('script'); s.src = '/static/vendor/echarts-5.6.0.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    return echartsReady;
  }
  function chart(id) {
    const el = $(id); if (!el) return null;
    let c = st.charts[id];
    if (!c || c.isDisposed()) { el.innerHTML = ''; c = st.charts[id] = echarts.init(el, null, {renderer: 'canvas'}); }
    return c;
  }
  const same = (k, v) => { const s = JSON.stringify(v); if (st.sig[k] === s) return true; st.sig[k] = s; return false; };
  function goFilter(id, value) {
    const el = $(id); if (!el) return;
    ['f-structure', 'f-signal', 'f-symbol'].forEach(k => { const e = $(k); if (e && k !== id) e.value = ''; });
    el.value = el.value === value ? '' : value;
    if (typeof applyFilters === 'function') applyFilters();
    const t = $('main-table'); if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  function direction() {
    const s = st.state; if (!s) return; const c = s.counts || {}, valid = s.valid_scanned ?? 0;
    const bull = c.bullish || 0, bear = c.bearish || 0, neu = Math.max(0, valid - bull - bear), k = C();
    if (same('dir', [bull, bear, neu, s.market_state?.bias])) return;
    const ch = chart('mo-c-dir'); if (!ch) return;
    ch.setOption({
      tooltip: {trigger: 'item', backgroundColor: k.p2, borderColor: k.b, textStyle: {color: k.t, fontSize: 12}, formatter: p => `${p.name}: <b>${p.value}</b> stocks (${p.percent}%)`},
      series: [{type: 'pie', radius: ['52%', '78%'], center: ['50%', '54%'], avoidLabelOverlap: true, itemStyle: {borderColor: k.p2, borderWidth: 2, borderRadius: 4}, label: {show: false}, emphasis: {scale: true, scaleSize: 6},
        data: [{name: 'Bullish', value: bull, itemStyle: {color: k.g}}, {name: 'Bearish', value: bear, itemStyle: {color: k.r}}, {name: 'Neutral / none', value: neu, itemStyle: {color: k.b}}]}],
      graphic: [{type: 'text', left: 'center', top: '40%', style: {text: String(bull + bear), fill: k.t, font: '700 22px monospace', textAlign: 'center'}},
                {type: 'text', left: 'center', top: '55%', style: {text: (s.market_state?.bias || 'with a direction').toString().toLowerCase(), fill: k.m, font: '11px sans-serif', textAlign: 'center'}}],
      legend: {bottom: 0, itemWidth: 9, itemHeight: 9, textStyle: {color: k.m, fontSize: 10.5}}
    }, true);
    ch.off('click'); ch.on('click', p => { if (p.name === 'Bullish' || p.name === 'Bearish') goFilter('f-signal', p.name); });
  }
  function oi() {
    const b = st.state?.market_state?.breadth; if (!b) return; const k = C();
    const rows = [['Long Buildup', b.long_buildup, k.g], ['Short Covering', b.short_covering, '#4ade80'], ['Long Unwinding', b.long_unwinding, k.amber], ['Short Buildup', b.short_buildup, k.r], ['Neutral', b.neutral, k.b]];
    if (same('oi', rows.map(r => r[1]))) return;
    const ch = chart('mo-c-oi'); if (!ch) return;
    ch.setOption({
      grid: {left: 6, right: 34, top: 8, bottom: 6, containLabel: true},
      tooltip: {trigger: 'item', backgroundColor: k.p2, borderColor: k.b, textStyle: {color: k.t, fontSize: 12}, formatter: p => `${p.name}: <b>${p.value}</b> stocks`},
      xAxis: {type: 'value', show: false}, yAxis: {type: 'category', inverse: true, data: rows.map(r => r[0]), axisLine: {show: false}, axisTick: {show: false}, axisLabel: {color: k.m, fontSize: 11}},
      series: [{type: 'bar', barWidth: 16, data: rows.map(r => ({value: r[1] || 0, name: r[0], itemStyle: {color: r[2], borderRadius: [0, 4, 4, 0]}})), label: {show: true, position: 'right', color: k.t, fontSize: 11, fontFamily: 'monospace'}, emphasis: {focus: 'self'}}]
    }, true);
    ch.off('click'); ch.on('click', p => goFilter('f-structure', p.name));
  }
  function leaders() {
    const ms = st.state?.market_state; const L = (ms?.oi_expansion || []).slice(0, 6); if (!L.length) return; const k = C();
    if (same('lead', L.map(x => [x.symbol, x.oi_day_chg_pct, x.price_chg_pct]))) return;
    const ch = chart('mo-c-lead'); if (!ch) return;
    const col = x => /Short Buildup|Long Unwinding/.test(x.structure || '') ? k.r : /Long Buildup|Short Covering/.test(x.structure || '') ? k.g : k.a;
    ch.setOption({
      grid: {left: 6, right: 58, top: 8, bottom: 6, containLabel: true},
      tooltip: {trigger: 'item', backgroundColor: k.p2, borderColor: k.b, textStyle: {color: k.t, fontSize: 12}, formatter: p => { const x = L[p.dataIndex]; return `<b>${esc(x.symbol)}</b> · ${esc(x.structure || '—')}<br>OI day ${pct(x.oi_day_chg_pct)} · price ${pct(x.price_chg_pct)}<br>OI 30m ${pct(x.oi_30m_chg_pct)} · vol ${ok(x.vol_multiple) ? fmt(x.vol_multiple, 1) + '×' : '—'}`; }},
      xAxis: {type: 'value', show: false}, yAxis: {type: 'category', inverse: true, data: L.map(x => x.symbol), axisLine: {show: false}, axisTick: {show: false}, axisLabel: {color: k.t, fontSize: 11, fontWeight: 600}},
      series: [{type: 'bar', barWidth: 14, data: L.map(x => ({value: Math.abs(x.oi_day_chg_pct || 0), itemStyle: {color: col(x), borderRadius: [0, 4, 4, 0]}})), label: {show: true, position: 'right', color: k.m, fontSize: 10.5, fontFamily: 'monospace', formatter: p => pct(L[p.dataIndex].oi_day_chg_pct)}}]
    }, true);
    ch.off('click'); ch.on('click', p => goFilter('f-symbol', L[p.dataIndex].symbol));
  }
  function trend() {
    const L = ((st.idx && st.idx.indices) || []).filter(x => x.label !== 'INDIA VIX' && (x.hist || []).length > 5); if (!L.length) return; const k = C();
    if (same('trend', [st.win, L.map(x => [x.label, (x.hist || []).length, (x.hist || []).slice(-1)[0]])])) return;
    const ch = chart('mo-c-trend'); if (!ch) return;
    const pal = [k.a, k.g, k.amber, '#a78bfa'];
    const series = L.map((x, i) => { const h = x.hist.slice(-st.win), b = h[0][1]; return {name: x.label, type: 'line', showSymbol: false, smooth: .2, lineStyle: {width: 1.8}, color: pal[i % pal.length], emphasis: {focus: 'series'}, data: h.map(p => [p[0], +((p[1] / b - 1) * 100).toFixed(2)])}; });
    ch.setOption({
      grid: {left: 4, right: 6, top: 22, bottom: 4, containLabel: true},
      legend: {top: 0, itemWidth: 12, itemHeight: 3, textStyle: {color: k.m, fontSize: 10}},
      tooltip: {trigger: 'axis', backgroundColor: k.p2, borderColor: k.b, textStyle: {color: k.t, fontSize: 11.5}, valueFormatter: v => pct(v)},
      xAxis: {type: 'time', axisLabel: {color: k.m, fontSize: 10, hideOverlap: true}, axisLine: {lineStyle: {color: k.b}}, splitLine: {show: false}},
      yAxis: {type: 'value', scale: true, axisLabel: {color: k.m, fontSize: 10, formatter: v => v + '%'}, splitLine: {lineStyle: {color: k.b, opacity: .5}}},
      series
    }, true);
  }
  function charts() { loadEcharts().then(() => { direction(); oi(); leaders(); trend(); }).catch(() => {}); }

  // The scanner state is already polled every few seconds by the dashboard: reuse it, no extra request.
  window.__dbiPulse = function (state) { st.state = state; renderFoot(); charts(); };
  function renderFoot() {
    const q = st.idx?.status?.quote_at, s = st.state;
    $('mo-foot').textContent = 'Index prices from the sector cache' + (q ? ' · quotes ' + q.replace('T', ' ').slice(11, 16) + ' IST' : '') + (s ? ' · scanner ' + (s.scan_status || '') : '') + '. Sector and stock detail: Sector Analysis page.';
  }
  async function loadIdx() {
    try { const r = await fetch('/api/sector-analysis/dashboard?lite=1', {cache: 'no-store'}); if (!r.ok) throw 0; st.idx = await r.json(); renderIdx(); renderSec(); renderFoot(); charts();
      if (!(st.idx.indices || []).some(x => x.label === 'GIFT NIFTY') && (st.giftTry = (st.giftTry || 0) + 1) <= 3) setTimeout(loadIdx, 4000); }
    catch (e) { if (!st.idx) $('mo-idx').innerHTML = ''; }
  }
  $('mo-win').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.win = +b.dataset.w; document.querySelectorAll('#mo-win button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); charts(); });
  window.addEventListener('resize', () => Object.values(st.charts).forEach(c => c && !c.isDisposed() && c.resize()));
  function live() { const t = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Kolkata'})), m = t.getHours() * 60 + t.getMinutes(); return t.getDay() > 0 && t.getDay() < 6 && m >= 545 && m <= 945; }
  setInterval(() => { if (!document.hidden && live()) loadIdx(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadIdx(); Object.values(st.charts).forEach(c => c && c.resize()); } });
  loadIdx(); loadEcharts().catch(() => {});
  // ---- desks at a glance (owner only; the route answers 403 for anyone else and the strip simply stays hidden) ----
  function renderDesks(g) {
    const el = $('mo-desks'); if (!g) { el.hidden = true; return; }
    const chip = (label, val, sub, o) => { o = o || {}; const t = `<span>${label}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ''}`; return o.href && own ? `<a class="mo-chip ${o.cls || ''}" href="${o.href}">${t}</a>` : `<div class="mo-chip ${o.cls || ''}">${t}</div>`; };
    const own = g.role === 'owner', c = [], p = g.pod || {}, t = p.today, rc = p.record, rs = g.rs, ng = g.ng, rec = g.rec;
    c.push(chip('Kite', g.kite ? '● logged in' : '○ login needed', g.kite ? '' : 'log in before 09:00', {cls: g.kite ? 'ok' : 'bad', href: '/'}));
    c.push(t ? chip('Pick of the day', `${t.side === 'UP' ? '▲' : '▼'} ${esc(t.symbol)}${t.grade ? ' · ' + esc(t.grade) : ''}`, ok(t.ret_pct) ? `result ${t.ret_pct > 0 ? '+' : ''}${t.ret_pct}%` : `${t.trades} trade${t.trades === 1 ? '' : 's'} today · exit ${esc(t.exit_at || '15:15')}`, {cls: t.side === 'UP' ? 'up' : 'dn', href: '/admin/intraday'})
                 : chip('Pick of the day', 'waiting 09:25', 'one DOWN trade every day', {href: '/admin/intraday'}));
    if (rc) c.push(chip('Last ' + rc.n + ' picks', `${rc.win}% won`, rc.a_n ? `grade A ${rc.a_win}% (${rc.a_n})` : 'no grade A yet', {href: '/admin/intraday'}));
    c.push(rs ? chip('Relative strength', `${esc(rs.at)} · ${rs.n} pick${rs.n === 1 ? '' : 's'}`, rs.top ? `${esc(rs.top.symbol)} ${rs.top.side === 'UP' ? '▲' : '▼'} z ${rs.top.z}${rs.top.reserve ? ' (reserve)' : ''}` + (rs.settled ? ` · ${rs.wins}/${rs.settled} won` : '') : 'none qualify', {href: '/admin/intraday'}) : chip('Relative strength', 'from 11:15', '', {href: '/admin/intraday'}));
    c.push(ng ? chip('NG desk', ng.signal ? `${esc(ng.signal.side)} · ${esc(ng.signal.leg)}` : 'no setup', ng.signal ? `hold ${ng.signal.hold}d${ng.signal.provisional ? ' · today' : ''}` : (ng.next_check ? 'next check ' + esc(ng.next_check) : (ng.error ? 'loading' : '')), {href: '/admin/commodity'}) : chip('NG desk', 'loading', '', {href: '/admin/commodity'}));
    if (rec && rec.total != null) c.push(chip('Recorders', `${rec.ok} OK`, rec.problems ? `${rec.problems} need attention` : 'all healthy', {cls: rec.problems ? 'bad' : 'ok', href: '/backtest'}));
    el.innerHTML = c.join(''); el.hidden = false;
  }
  async function loadDesks() { try { const r = await fetch('/api/desks/glance', {cache: 'no-store'}); renderDesks(r.ok ? await r.json() : null); } catch (e) { renderDesks(null); } }
  setInterval(() => { if (!document.hidden) loadDesks(); }, 30000); loadDesks();

})();
</script>
</section>
